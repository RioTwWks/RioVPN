name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ============================================
  # Lint Job
  # ============================================
  lint:
    name: 📏 Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black mypy

      - name: 🔍 Run flake8
        run: |
          flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: 🎨 Run black (check only)
        run: |
          black --check src/ tests/

      - name: 📐 Run mypy
        run: |
          mypy src/ --ignore-missing-imports --no-strict-optional || true

  # ============================================
  # Test Job
  # ============================================
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint

    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Run tests with coverage
        run: |
          pytest \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -v \
            --tb=short

      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.python-version }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: 📁 Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: htmlcov/
          retention-days: 7

  # ============================================
  # Security Scan Job
  # ============================================
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety pip-audit

      - name: 🛡️ Run bandit (security linter)
        run: |
          bandit -r src/ -f json -o bandit-report.json || true

      - name: 📊 Upload bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-security-report
          path: bandit-report.json
          retention-days: 7

      - name: 🔍 Check dependencies with safety
        run: |
          safety check --json > safety-report.json || true

      - name: 🔍 Audit pip dependencies
        run: |
          pip-audit --desc -f json > pip-audit-report.json || true

  # ============================================
  # Docker Build Job
  # ============================================
  docker:
    name: 🐳 Build Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🏷️ Get version from package.json or default
        id: version
        run: echo "version=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build bot image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: riovpn-bot:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: 🏗️ Build worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.worker
          push: false
          tags: riovpn-worker:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: 🧪 Test Docker images
        run: |
          docker run --rm riovpn-bot:${{ steps.version.outputs.version }} python -c "import src; print('Bot OK')"
          docker run --rm riovpn-worker:${{ steps.version.outputs.version }} python -c "import src; print('Worker OK')"

  # ============================================
  # Deploy Job (Production)
  # ============================================
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test, security, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: production
      url: https://t.me/your_bot

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🏷️ Get version
        id: version
        run: echo "version=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: 📝 Create deployment summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All checks passed successfully!" >> $GITHUB_STEP_SUMMARY

      - name: 📢 Notify deployment (optional)
        run: |
          echo "Deployment would be triggered here"
          echo "Configure your deployment script or use actions like:"
          echo "- aws-actions/configure-aws-credentials"
          echo "- azure/webapps-deploy"
          echo "- google-github-actions/deploy-appengine"
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}

  # ============================================
  # Notify Job
  # ============================================
  notify:
    name: 📬 Notify Results
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()

    steps:
      - name: 📊 Job status
        run: |
          echo "Pipeline completed with status: ${{ needs.deploy.result }}"
          
      - name: 📝 Create final summary
        run: |
          echo "## ✅ Pipeline Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test (3.11) | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker | ${{ needs.docker.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy | ${{ needs.deploy.result }} |" >> $GITHUB_STEP_SUMMARY

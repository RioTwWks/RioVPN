version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: riovpn-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-riovpn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-riovpn_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-riovpn}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-riovpn}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - riovpn-network
    restart: unless-stopped

  # Run database migrations
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: riovpn-migrate
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-riovpn}:${POSTGRES_PASSWORD:-riovpn_secret_password}@postgres:5432/${POSTGRES_DB:-riovpn}
    env_file:
      - .env
    volumes:
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini
    command: python -m migrations upgrade head
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - riovpn-network
    restart: "no"

  # Telegram Bot
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: riovpn-bot
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-riovpn}:${POSTGRES_PASSWORD:-riovpn_secret_password}@postgres:5432/${POSTGRES_DB:-riovpn}
    env_file:
      - .env
    ports:
      - "${WEBHOOK_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - riovpn-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Background Worker (optional - bot includes scheduler)
  # worker:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.worker
  #   container_name: riovpn-worker
  #   environment:
  #     DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-riovpn}:${POSTGRES_PASSWORD:-riovpn_secret_password}@postgres:5432/${POSTGRES_DB:-riovpn}
  #   env_file:
  #     - .env
  #   depends_on:
  #     - postgres
  #   networks:
  #     - riovpn-network
  #   restart: unless-stopped

  # Webhook receiver (nginx) - optional
  # nginx:
  #   image: nginx:alpine
  #   container_name: riovpn-nginx
  #   ports:
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - bot
  #   networks:
  #     - riovpn-network
  #   restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  riovpn-network:
    driver: bridge
